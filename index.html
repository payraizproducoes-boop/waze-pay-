<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Waze Pay - Seleção de Números</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #1b8f3a;
    color: white;
    text-align: center;
    margin: 0;
    padding: 20px;
}
h1 {
    margin-bottom: 5px;
}
#relogio-container {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 10px;
}
#mensagem {
    font-size: 18px;
    margin-bottom: 15px;
}
.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr); /* 5 números por fileira */
    gap: 15px;
    justify-items: center;
    margin-bottom: 20px;
}
.numero {
    width: 70px;
    height: 70px;
    border-radius: 12px;
    border: 2px solid white;
    background: white;
    color: #1b8f3a;
    font-weight: bold;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
.numero.selecionado {
    background: #1b8f3a;
    color: white;
    border: 2px solid white;
}
#btn-whatsapp {
    display: none;
    margin-top: 20px;
    padding: 20px 25px;
    font-size: 20px;
    background: white;
    color: #1b8f3a;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}
#numeros {
    margin-top: 15px;
    font-size: 20px;
}
</style>
</head>
<body>

<h1>Waze Pay</h1>

<div id="relogio-container">
    Próximo sorteio em: <span id="relogio">00:00</span>
</div>

<div id="mensagem">Escolha os seus 5 números e confirme no final da tela.</div>

<div class="grid" id="grade"></div>

<p>Seus números escolhidos: <span id="numeros">Nenhum</span></p>

<button id="btn-whatsapp">Confirmar Números</button>

<script>
const grade = document.getElementById("grade");
const numerosSpan = document.getElementById("numeros");
const btnWhats = document.getElementById("btn-whatsapp");
let escolhidos = [];
const MAX_ESCOLHA = 5;
const numeroWhats = "5511916699712"; // coloque seu número do WhatsApp

// Criar números 01 a 99
for(let i=1;i<=99;i++){
    const div = document.createElement("div");
    div.className = "numero";
    div.innerText = i.toString().padStart(2,'0');
    div.onclick = ()=>{
        if(div.classList.contains("selecionado")){
            div.classList.remove("selecionado");
            escolhidos = escolhidos.filter(n => n !== div.innerText);
        } else {
            if(escolhidos.length >= MAX_ESCOLHA){
                alert("Você só pode escolher 5 números!");
                return;
            }
            div.classList.add("selecionado");
            escolhidos.push(div.innerText);
        }
        numerosSpan.innerText = escolhidos.sort((a,b)=>a-b).join(", ");
        btnWhats.style.display = (escolhidos.length === MAX_ESCOLHA) ? "inline-block" : "none";
    }
    grade.appendChild(div);
}

// Botão WhatsApp
btnWhats.onclick = ()=>{
    const msg = `Meus números escolhidos: ${escolhidos.sort((a,b)=>a-b).join(", ")}. Aguardando aprovação.`;
    const url = `https://wa.me/${numeroWhats}?text=${encodeURIComponent(msg)}`;
    window.open(url, "_blank");
}

// Relógio do próximo sorteio
function proximoSorteio(){
    const agora = new Date();
    let minutos = Math.floor(agora.getMinutes()/15)*15 + 15;
    let hora = agora.getHours();
    if(minutos >= 60){ minutos -= 60; hora += 1; }
    if(hora >= 24){ hora = 7; minutos = 0; }
    if(hora < 7) { hora = 7; minutos = 0; }
    return new Date(agora.getFullYear(), agora.getMonth(), agora.getDate(), hora, minutos, 0);
}

function atualizarRelogio(){
    const agora = new Date();
    const prox = proximoSorteio();
    let diff = prox - agora;
    if(diff < 0) diff = 0;
    const minutos = String(Math.floor(diff/60000)).padStart(2,'0');
    const segundos = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
    document.getElementById("relogio").textContent = `${minutos}:${segundos}`;
    setTimeout(atualizarRelogio, 1000);
}

// Inicializar
window.onload = ()=>{
    atualizarRelogio();
};
</script>

</body>
</html>
