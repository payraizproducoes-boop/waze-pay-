<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Waze Pay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    text-align: center;
    margin: 0;
    padding: 15px;
}

h1 {
    color: #1b8f3a;
    margin-bottom: 10px;
}

#relogio {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 15px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    max-width: 420px;
    margin: auto;
}

.numero {
    background: white;
    border-radius: 50%;
    padding: 12px;
    font-weight: bold;
    cursor: pointer;
    border: 2px solid #1b8f3a;
    color: #1b8f3a;
    user-select: none;
}

.numero.selecionado {
    background: #1b8f3a;
    color: white;
}

#resultado {
    margin-top: 15px;
    font-size: 16px;
}

#botaoWhatsapp {
    display: none;
    margin-top: 20px;
    padding: 14px 20px;
    font-size: 18px;
    background: #25D366;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>Waze Pay</h1>

<div id="relogio">Carregando próximo sorteio...</div>

<p>Escolha <b>5 números</b></p>

<div class="grid" id="grade"></div>

<div id="resultado">
Números escolhidos: <span id="numeros">Nenhum</span>
</div>

<button id="botaoWhatsapp" onclick="irParaWhatsapp()">
Continuar para WhatsApp
</button>

<script>
// ===== RELÓGIO =====
function atualizarRelogio() {
    const agora = new Date();
    const h = agora.getHours();
    const m = agora.getMinutes();
    const s = agora.getSeconds();

    const rel = document.getElementById("relogio");

    if (h < 7 || h >= 24) {
        rel.innerText = "⛔ Apostas encerradas. Retornamos às 07:00.";
        return;
    }

    let proxMin = Math.ceil(m / 15) * 15;
    let proxHora = h;

    if (proxMin === 60) {
        proxMin = 0;
        proxHora++;
    }

    if (proxHora >= 24) {
        rel.innerText = "⛔ Último sorteio do dia encerrado.";
        return;
    }

    const prox = new Date();
    prox.setHours(proxHora, proxMin, 0, 0);

    const diff = prox - agora;
    const minRest = Math.floor(diff / 60000);
    const segRest = Math.floor((diff % 60000) / 1000);

    rel.innerText =
        "⏰ Próximo sorteio às " +
        String(proxHora).padStart(2, "0") + ":" +
        String(proxMin).padStart(2, "0") +
        " — em " +
        String(minRest).padStart(2, "0") + ":" +
        String(segRest).padStart(2, "0");
}

setInterval(atualizarRelogio, 1000);
atualizarRelogio();

// ===== NÚMEROS =====
const grade = document.getElementById("grade");
const numerosSpan = document.getElementById("numeros");
const botaoWhatsapp = document.getElementById("botaoWhatsapp");

let escolhidos = [];

for (let i = 1; i <= 99; i++) {
    const d = document.createElement("div");
    d.className = "numero";
    d.innerText = i.toString().padStart(2, "0");

    d.onclick = () => {
        const n = d.innerText;

        if (d.classList.contains("selecionado")) {
            d.classList.remove("selecionado");
            escolhidos = escolhidos.filter(x => x !== n);
        } else {
            if (escolhidos.length >= 5) {
                alert("Você só pode escolher 5 números.");
                return;
            }
            d.classList.add("selecionado");
            escolhidos.push(n);
        }

        escolhidos.sort();
        numerosSpan.innerText = escolhidos.join(", ");
        botaoWhatsapp.style.display = escolhidos.length === 5 ? "block" : "none";
    };

    grade.appendChild(d);
}

// ===== WHATSAPP =====
function irParaWhatsapp() {
    const texto =
        "Meus números escolhidos: " +
        escolhidos.join(", ") +
        ". Aguardando aprovação.";

    const telefone = "5511916699712";
    const url = "https://wa.me/" + telefone + "?text=" + encodeURIComponent(texto);
    window.location.href = url;
}
</script>

</body>
</html>
